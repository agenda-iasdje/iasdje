<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Agenda Fácil IASD</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">

  <!-- Ícone e nome na tela inicial (iPhone) -->
  <link rel="apple-touch-icon" href="icone.png">
  <meta name="apple-mobile-web-app-title" content="Agenda Fácil">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Ícone e nome na tela inicial (Android) -->
  <link rel="icon" href="icone.png">
  <link rel="manifest" href="manifest.json">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#1E40AF">

  <style>
    html, body { margin: 0; height: 100%; background: #ffffff; overflow: hidden; }
    iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  </style>
</head>
<body>
  <!-- ▼▼ COLE AQUI o link do Web App (Implantar > Gerenciar implantações > URL, termina em /exec) ▼▼ -->
  <iframe id="app" data-src="https://script.google.com/macros/s/AKfycbzB2JfWLQbrd7KQW-ujer_3IsoG8wid6qAvwztkwp0pEdls0chmPb9wvZpIzUURpWy5/exec"
          allow="clipboard-write; fullscreen"
          title="Agenda Fácil IASD"></iframe>
  <script>
    // repassa os parâmetros do link (ex.: ?evento=123) para o app do Apps Script
    var f = document.getElementById("app");
    f.src = f.getAttribute("data-src") + (location.search || "");
  </script>

  <!-- ===== NOTIFICAÇÕES (OneSignal) =====
       1) Cole o App ID do OneSignal abaixo (OneSignal > Settings > Keys & IDs > OneSignal App ID).
       2) O arquivo OneSignalSDKWorker.js precisa estar nesta mesma pasta (agenda-facil) no GitHub.
       O app avisa qual é o departamento salvo e este celular recebe a etiqueta "departamento". -->
  <script>
    var ONESIGNAL_APP_ID = "5ada43de-5b78-4f33-a542-71ed3b243566";
    var notificacoesLigadas = ONESIGNAL_APP_ID.indexOf("COLE_AQUI") !== 0;

    window.OneSignalDeferred = window.OneSignalDeferred || [];
    if (notificacoesLigadas) {
      var s = document.createElement("script");
      s.src = "https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js";
      s.defer = true;
      document.head.appendChild(s);
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: ONESIGNAL_APP_ID,
          serviceWorkerPath: "iasdje/agenda-facil/OneSignalSDKWorker.js",
          serviceWorkerParam: { scope: "/iasdje/agenda-facil/" },
          promptOptions: {
            slidedown: {
              prompts: [{
                type: "push",
                autoPrompt: true,
                text: {
                  actionMessage: "Quer receber avisos de escalas pendentes do seu departamento e dos próximos cultos?",
                  acceptButton: "Quero receber",
                  cancelButton: "Agora não"
                },
                delay: { pageViews: 1, timeDelay: 8 }
              }]
            }
          }
        });
      });
    }

    // O app (dentro do iframe) manda o departamento salvo; marcamos este celular no OneSignal
    window.addEventListener("message", function(ev) {
      var d = ev.data || {};
      if (d.app !== "agendaFacil" || d.tipo !== "departamento" || !notificacoesLigadas) return;
      var host = "";
      try { host = new URL(ev.origin).hostname; } catch (e) { return; }
      if (!/(\.googleusercontent\.com|script\.google\.com)$/.test(host)) return;   // só aceita o app do Apps Script
      OneSignalDeferred.push(function(OneSignal) {
        OneSignal.User.addTag("departamento", d.valor || "ALL");
      });
    });
  </script>
</body>
</html>
